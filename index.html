<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>บันทึกการโอนเงิน</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff;
    }

    /* ===== หน้าจอโหลด ===== */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, 'Noto Sans Thai', sans-serif;
      font-size: 16px;
      font-weight: 500;
    }

    /* ===== iFrame เต็มหน้าจอ ===== */
    #app-frame {
      width: 100%;
      height: 100dvh;
      border: none;
      display: block;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- หน้าจอโหลด -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">กำลังโหลดระบบ...</div>
  </div>

  <!-- Google Apps Script App -->
  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbzReYFQxHBut67R_PBocxqwC_55lIIDyAY_vEzz8vOKBMrnqmxQbKwN41N9PBRQh72z/exec"
    allowfullscreen
    allow="fullscreen"
    scrolling="no"
    frameborder="0"
  ></iframe>

  <script>
    // ซ่อนหน้าโหลดเมื่อ iFrame โหลดเสร็จ
    const iframe = document.getElementById('app-frame');
    const loading = document.getElementById('loading-screen');

    function hideLoading() {
      loading.classList.add('hidden');
    }

    iframe.addEventListener('load', hideLoading);

    // สำรอง — ซ่อนหลัง 3 วินาที หาก onload ไม่ทำงาน
    setTimeout(hideLoading, 3000);
  </script>

</body>
</html>
